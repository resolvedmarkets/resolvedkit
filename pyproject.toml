[project]
name = "resolvedkit"
version = "0.1.0"
description = "A Polymarket backtester that tests strategies against the real order book. Fills walk the L2 ladder, fees follow Polymarket's curve, positions settle at resolution."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Resolved Markets", email = "info@resolvedmarkets.com" }]
keywords = ["polymarket", "polymarket-backtester", "backtesting", "prediction-markets", "orderbook", "trading", "quant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["pyarrow>=14", "requests>=2.31"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "matplotlib>=3.7"]

[project.scripts]
resolvedkit = "resolvedkit.cli:main"

[project.urls]
Homepage = "https://github.com/resolvedmarkets/resolvedkit"
Data = "https://resolvedmarkets.com"
Issues = "https://github.com/resolvedmarkets/resolvedkit/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
